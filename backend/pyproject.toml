[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28,<1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.142.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncmy>=0.2.10,<0.3",
    "alembic>=1.14,<2",
    "pyjwt>=2.10,<3",
    "pwdlib[argon2]>=0.3,<1",
    "cryptography>=46",
    "redis>=5,<8",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langsmith>=0.14,<0.15",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
